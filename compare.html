<!DOCTYPE html>
<html  lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title><Compare Stocks</title>

        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </head>

    <body class="bg-black text-stone-100 min-h-screen font-sans">
        <main class="max-w-5xl mx-auto px-6 py-8 space-y-6">

            <a href="index.html" class="text-stone-400 hover:text-stone-300">
                Back to Dashboard
            </a>

            <section>
                <h1 class="text-3xl font-bold">Compare Stocks</h1>
                <p class="text-stone-400 mt-2">

                </p>
            </section>

            <section class="bg-stone-900 border bprder-stone-800 rounded-2xl p-6 space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <label class="space-y-2">
                        <span class="block text-sm text-blue-400"> Blue Line></span>
                        <select id="stockA" class="w-full bg-stone-950 border border-stone-700 rounded-lg p-3"></select>
                    </label>

                    <label class="space-y-2">
                        <span  class="block text-sm text-orange-400">Orange Line</span>
                        <select id="stockB"  class="w-full bg-stone-950 border border-stone-700 rounded-lg p-3"></select>
                    </label>

                    <label class0space-y-2
>
                        <span class="block text-sm text-stone-400">Timeframe</span>
                        <select id="timeframe" class="w-full bg-stone-950 border border-stone-700 rounded-lg p-3">
                            <option value="1D">1 Day</option>
                            <option value="1W" selected>1 Week</option>
                            <option value="1M">1 Month</option>
                            <option value="1Y">1 Year</option>
                        </select>
                    </label>                
                </div>

                <p id="message" class="text-sm text-stone-400"></p>

                <div class="h-96">
                    <canvas id="comparisonChart"></canvas>
                </div>
                <p class="text-xs text-stone-500">
                  The lines show the percentage-based trend starting from the initial point.
                  (Example Data)
                </p>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div class="bg-stone-950 border border-blue-500/40 rounded-xl p-4">
                        <p id="summaryStockAName" class="text-sm text-blue-400">Blue Line</p>
                        <p id="summaryStockAReturn" class="text-2xl font-bold mt-2">>--</p>
                    </div>

                    <div class="bg-stone-950 border border-orange-500/40 rounded-xl p-4">
                        <p id="summaryStockBName" class="text-sm text-orange-400">Orange Line</p>
                        <p id="summaryStockBReturn" class="text-2xl font-bold mt-2">--</p>
                    </div>

                    <div class="bg-stone-950 border border-stone-800 rounded-xl p-4">
                        <p class="text-sm text-stone-400">Best in selected period</p>
                        <p id="summaryWinner" class="text-2xl font-bold mt-2">--</p>
                        <p id="summaryDifference" class="text-xs text-stone-400 mt-1">--</p>
                    </div>
                </div>
            </section>
        </main>

        <script>
            const savedStocks = localStorage.getItem("stocksForComparison");
            const stocks = savedStocks ? JSON.parse(savedStocks) : [];

            const stockASelect = document.getElementById("stockA");
            const stockBSelect = document.getElementById("stockB");
            const timeframeSelect =  document.getElementById("timeframe");
            const message = document.getElementById("message");
            let comparisonChart = null;

            function addStockOptions() {
                stocks.forEach(stock => {
                    stockASelect.add(new Option(`${stock.name} (${stock.symbol})`, stock.symbol));
                    stockBSelect.add(new Option (`${stock.name} (${stock.symbol})`, stock.symbol));
                });

                if (stocks.length > 1) {
                    stockBSelect.selectedIndex = 1;
                }
            }

            function getStock(symbol) {
                return stocks.find(stock => stock.symbol === symbol);
            }

            function renderComparison() {
                const stockA = getStock(stockASelect.value);
                const stockB = getStock(stockBSelect.value);
                const timeframe = timeframeSelect.value;

                if (!stockA || !stockB) return;

                const valuesA = stockA.history[timeframe] || stockA.history["1W"];
                const valuesB = stockB.history[timeframe] || stockB.history["1W"];
                const pointCount = Math.min(valuesA.length, valuesB.length);

                const normalizedA = valuesA.slice(0, pointCount).map(value => (value / valuesA[0]) * 100);
                const normalizedB = valuesB.slice(0, pointCount).map(value => (value / valuesB[0]) * 100);

                const returnA = normalizedA[normalizedA.length - 1] - 100;
                const returnB = normalizedB[normalizedB.length - 1] - 100;

                function formatPercent(value) {
                    const sign =  value >= 0 ? "+" : "";
                    return `${sign}${value.toFixed(2)}%`;
                }
                document.getElementById("summaryStockAName").textContent = 
                    `${stockA.name} (${stockA.symbol})`;
                document.getElementById("summaryStockAReturn").textContent = 
                    formatPercent(returnA);

                document.getElementById("summaryStockBName").textContent = 
                    `${stockB.name} (${stockB.symbol})`;
                document.getElementById("summaryStockBReturn").textContent = 
                    formatPercent(returnB);

                    const winnerElement = document.getElementById("summaryWinner");
                    const differenceElement = document.getElementById("summaryDifference");
                    const difference = Math.abs(returnA - returnB);

                    if (difference < 0.01) {
                        winnerElement.textContent = "Tie";
                        differenceElement.textContent = "Both stocks performed equally";
                    } else {
                        const winner = returnA > returnB ? stockA : stockB;
                        winnerElement.textContent = winner.symbol;
                        differenceElement.textContent = 
                        `Ahead by ${difference.toFixed(2)} percentage points`;
                    }

                const labels =Array.from({ length: pointCount },(_, index) => `Point ${index + 1}`);

                if (comparisonChart) {
                    comparisonChart.destroy();
                }
                comparisonChart = new Chart(document.getElementById("comparisonChart").getContext("2d"),
                {
                    type: "line",
                    data: {
                        labels,
                        datasets: [
                            {
                                label: stockA.symbol,
                                data: normalizedA,
                                borderColor: "#60a5fa",
                                backgroundColor: "#60a5fa",
                                borderWidth: 2,
                                tension: 0.3
                            },
                            {
                                label: stockB.symbol,
                                data: normalizedB,
                                borderColor:  "#fb923c",
                                backgroundColor: "#fb923c",
                                borderWidth: 2,
                                tension: 0.3
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: {
                            mode: "index",
                            intersect: false
                        },
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const change = context.parsed.y - 100;
                                        const sign = change >= 0 ? "+" : "";
                                        return `${context.dataset.label}:${sign}${change.toFixed(2)}%`;
                                    }
                                }
                            }
                        },
                        scales: {
                            x:  {
                                ticks:  { color: "#a8a29e" },
                                grid: { display: false }
                            },
                            y: {
                                ticks:  {
                                    color: "#a8a29e",
                                    callback: value => `${(value - 100).toFixed(0)}%`
                                },
                                title:  {
                                    display: true,
                                    text: "change since the start",
                                    color: "#a8a29e"
                                },
                                grid: { color: "rgba(120, 113, 108, 0.2)"}
                            }
                        }
                    }
                }
            );        
        }

        if (stocks.length < 2) {
            message.textContent = 
            "No stocks found. First, open the dashboard and click on “Compare stocks” there.";
        } else {
            addStockOptions();
            renderComparison();

            stockASelect.addEventListener("change", renderComparison);
            stockBSelect.addEventListener("change", renderComparison);
            timeframeSelect.addEventListener("change", renderComparison);
        }
        </script>
    </body>
</html>
