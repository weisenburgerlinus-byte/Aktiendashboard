<!DOCTYPE html>
<html  lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title><Compare Stocks</title>

        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </head>

    <body class="bg-black text-stone-100 min-h-screen font-sans">
        <main class="max-w-5xl mx-auto px-6 py-8 space-y-6">

            <a href="index.html" class="text-stone-400 hover:text-stone-300">
                Back to Dashboard
            </a>

            <section>
                <h1 class="text-3xl font-bold">Compare Stocks</h1>
                <p class="text-stone-400 mt-2">

                </p>
            </section>

            <section class="bg-stone-900 border bprder-stone-800 rounded-2xl p-6 space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <label class="space-y-2">
                        <span class="block text-sm text-blue-400"> Blue Line></span>
                        <select id="stockA" class="w-full bg-stone-950 border border-stone-700 rounded-lg p-3"></select>
                    </label>

                    <label class="space-y-2">
                        <span  class="block text-sm text-orange-400">Orange Line</span>
                        <select id="stockB"  class="w-full bg-stone-950 border border-stone-700 rounded-lg p-3"></select>
                    </label>

                    <label class0space-y-2
>
                        <span class="block text-sm text-stone-400">Timeframe</span>
                        <select id="timeframe" class="w-full bg-stone-950 border border-stone-700 rounded-lg p-3">
                            <option value="1D"></option>
                            <option value="1W" selected></option>
                            <option value="1M"></option>
                            <option value="1Y"></option>
                        </select>
                    </label>                
                </div>

                <p id="message" class="text-sm text-stone-400"></p>

                <div class="h-96">
                    <canvas id="comparisonChart"></canvas>
                </div>
                <p class="text-xs text-stone-500">
                  The lines show the percentage-based trend starting from the initial point.
                  (Example Data)
                </p>
            </section>
        </main>

        <script>
            const savedStocks = localStorages.getItem("stocksForComparison");
            const stocks = savedStocks ? JSON.parse(savedStocks) : [];

            const stockASelect = document.getElementById("stockA");
            const stockBSelect = document.getElementById("stockB");
            const timeframeSelect =  document.getElementById("timeframe");
            const message = document.getElementById("message");
            let comparisonChart = null;

            function addStockOptions() {
                stocks.forEach(stock => {
                    stockASelect.add(new Option(`${stock.name} (${stock.symbol})`, stock.symbol));
                    stockBSelect.add(new Option (`${stock.name} (${stock.symbol})`, stock.symbol));
                });

                if (stocks.length > 1) {
                    stockBSelect.selectedIndex = 1;
                }
            }

            function getStock(symbol) {
                return stocks.find(stock => stock.symbol === symbol);
            }

            function renderComparison() {
                const stockA = getStock(stockASelect.value);
                const stockB = getStock(stockBSelect.value);
                const timeframe = timeframeSelect.value;

                if (!stockA || !stockB) return;

                const valuesA = stockA.history[timeframe] || stockA.history["1W"];
                const valuesB = stockB.history[timeframe] || stockB.history["1W"];
                const pointCount = Math.min(valuesA.length, valuesB.length);

                const normalizedA = valuesA.slice(0, pointCount).map(value => (value / valuesA[0]) * 100);
                const normalizedB = valuesB.slice(0, pointCount).map(value => (value / valuesB[0]) * 100);
                const labels =Array.from({ length: pointCount },(_, index) => `Point ${index + 1}`);

                if (comparisonChart) {
                    comparisonChart.destroy();
                }

                
            }

        </script>
    </body>
</html>
